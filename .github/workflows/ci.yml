name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  python-checks:
    name: Python checks (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python modules
        run: python -m compileall main.py logic.py database.py config.py export.py report_handler.py settings.py material_manager.py preview.py tests

      - name: Run tests
        run: python -m pytest

  fedora-checks:
    name: Fedora container checks
    runs-on: ubuntu-latest
    container: fedora:latest

    steps:
      - name: Install system tools
        run: dnf install -y git python3 python3-pip

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Compile Python modules
        run: python3 -m compileall main.py logic.py database.py config.py export.py report_handler.py settings.py material_manager.py preview.py tests

      - name: Run tests
        run: python3 -m pytest
